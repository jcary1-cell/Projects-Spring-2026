    const DEFAULT_ANTI_PATTERNS = [
      'NO generic purple-to-blue linear gradients on hero buttons.',
      'NO standard white-card-on-light-gray-background boilerplate styling.',
      'NO uniform rounded-2xl cards with soft dark floating blur shadows.',
      'NO vague corporate stock illustrations or floating 3D glossy spheres.',
      'NO default Tailwind Inter font without kerning or bespoke font pairing.',
      'USE distinct hairline border contrast (1px crisp neutral border) and intentional editorial serif/sans pairings.'
    ];

    // Theme Visual Presets
    const THEME_PRESETS = {
      editorial: {
        name: 'Warm Editorial Cream',
        bg: 'bg-[#FAF8F5]',
        panelBg: 'bg-white/80 backdrop-blur-md',
        border: 'border-stone-200/90',

    function App() {
      const [items, setItems] = useState(() => {
        const saved = localStorage.getItem('taste_gallery_items_v2');
        return saved ? JSON.parse(saved) : INITIAL_ITEMS;
      });

      const [themeKey, setThemeKey] = useState('editorial'); // 'editorial' | 'nordic' | 'dark'
      const activeTheme = THEME_PRESETS[themeKey];

      const [selectedIds, setSelectedIds] = useState([]);
      const [activeTab, setActiveTab] = useState('gallery'); // 'gallery' | 'builder' | 'signature' | 'sandbox'
      const [filterCategory, setFilterCategory] = useState('All');
      const [filterTag, setFilterTag] = useState('');
      const [searchQuery, setSearchQuery] = useState('');
      
      const [targetTool, setTargetTool] = useState('v0_lovable');
      const [isAddModalOpen, setIsAddModalOpen] = useState(false);
      const [viewItem, setViewItem] = useState(null);
      const [copiedText, setCopiedText] = useState(false);

      useEffect(() => {
        localStorage.setItem('taste_gallery_items_v2', JSON.stringify(items));
      }, [items]);

      const categories = ['All', 'Full Site', 'Hero Section', 'Typography', 'Color Palette', 'Components', 'Landing Page'];

      const allTags = useMemo(() => {
        const set = new Set();
        items.forEach(item => {
          if (item.aestheticTags) {
            item.aestheticTags.forEach(tag => set.add(tag));
          }
        });
        return Array.from(set);
      }, [items]);

      const filteredItems = useMemo(() => {
        return items.filter(item => {
          const matchesCategory = filterCategory === 'All' || item.category === filterCategory;
          const matchesTag = !filterTag || (item.aestheticTags && item.aestheticTags.includes(filterTag));
          const matchesSearch = !searchQuery || 
            item.title.toLowerCase().includes(searchQuery.toLowerCase()) ||
            item.promptKeywords.toLowerCase().includes(searchQuery.toLowerCase()) ||
            item.notes.toLowerCase().includes(searchQuery.toLowerCase());
          return matchesCategory && matchesTag && matchesSearch;
        });
      }, [items, filterCategory, filterTag, searchQuery]);

      const toggleSelect = (id) => {
        setSelectedIds(prev => 
          prev.includes(id) ? prev.filter(i => i !== id) : [...prev, id]
        );
      };

      const selectAll = () => {
        if (selectedIds.length === filteredItems.length) {
          setSelectedIds([]);
        } else {
          setSelectedIds(filteredItems.map(i => i.id));
        }
      };

      const handleAddItem = (newItem) => {
        setItems(prev => [newItem, ...prev]);
        setIsAddModalOpen(false);
      };

      const handleDeleteItem = (id) => {
        setItems(prev => prev.filter(item => item.id !== id));
        setSelectedIds(prev => prev.filter(i => i !== id));
        if (viewItem?.id === id) setViewItem(null);
      };

      const selectedItems = useMemo(() => {
        return items.filter(item => selectedIds.includes(item.id));
      }, [items, selectedIds]);

      const generatedPrompt = useMemo(() => {
        const activeSet = selectedItems.length > 0 ? selectedItems : items;
        if (activeSet.length === 0) return 'No design examples added yet. Add items to generate your prompt!';

        const keywords = Array.from(new Set(activeSet.flatMap(i => i.promptKeywords ? i.promptKeywords.split(', ') : []))).join(', ');
        const tags = Array.from(new Set(activeSet.flatMap(i => i.aestheticTags || []))).join(', ');
        const colorList = Array.from(new Set(activeSet.flatMap(i => i.colors || [])));
        const typographyList = Array.from(new Set(activeSet.map(i => i.typography).filter(Boolean))).join(' OR ');
        const layoutStyles = Array.from(new Set(activeSet.map(i => i.layoutStyle).filter(Boolean))).join('; ');

        if (targetTool === 'v0_lovable') {
          return `/// AESTHETIC DESIGN SYSTEM SPECIFICATION FOR WEB APP GENERATION ///\n\n` +
                 `[DESIGN VIBE & AESTHETIC SIGNATURE]:\n${tags}\n\n` +
                 `[COLOR PALETTE TOKENS]:\nPrimary, Secondary & Accents: ${colorList.join(' | ')}\n\n` +
                 `[TYPOGRAPHY SYSTEM]:\n${typographyList || 'High optical contrast font pairing (e.g., Cormorant Garamond header + Inter body)'}\n\n` +
                 `[LAYOUT & SPACING PRINCIPLES]:\n${layoutStyles}\n\n` +
                 `[KEY VISUAL PROMPT KEYWORDS & DESCRIPTORS]:\n${keywords}\n\n` +
                 `[STRICT ANTI-GENERIC AI RULES - DO NOT USE THESE BOILERPLATE DEFAULTS]:\n` +
                 DEFAULT_ANTI_PATTERNS.map(rule => `- ${rule}`).join('\n') +
                 `\n\n[INSTRUCTION]: Build the requested application/website adhering strictly to this aesthetic style guide. Prioritize bespoke editorial identity over generic web app template styling.`;
        }

        if (targetTool === 'system_prompt') {
          return `You are a Principal UI/UX Creative Director and Frontend Architect. When generating UI code, HTML, React components, or Tailwind styles, you MUST strictly adhere to this custom design identity rather than default AI boilerplate:\n\n` +
                 `1. AESTHETIC VIBE: ${tags}\n` +
                 `2. EXACT COLOR TOKENS: ${colorList.join(', ')}\n` +
                 `3. TYPOGRAPHY PAIRING: ${typographyList}\n` +
                 `4. LAYOUT & GRID RULES: ${layoutStyles}\n` +
                 `5. VISUAL TOKENS: ${keywords}\n\n` +
                 `6. CRITICAL DESIGN DIRECTIVES (AVOID AI GENERIC CLICHÉS):\n` +
                 DEFAULT_ANTI_PATTERNS.map(rule => `• ${rule}`).join('\n');
        }

        if (targetTool === 'midjourney') {
          return `/imagine prompt: web app user interface design mockup, ${tags.toLowerCase()}, ${keywords}, warm editorial layout, color palette featuring ${colorList.slice(0, 3).join(' and ')}, elegant serif headlines, clean grid hierarchy, featured on Awwwards and Mindsparkle Mag --ar 16:9 --v 6.0`;
        }

        if (targetTool === 'tailwind') {
          return `// Add to your tailwind.config.js theme.extend:\n\nmodule.exports = {\n  theme: {\n    extend: {\n      colors: {\n` +
                 colorList.reduce((acc, hex, idx) => acc + `        brand_${idx + 1}: '${hex}',\n`, '') +
                 `      },\n      fontFamily: {\n        heading: ['${typographyList.split(' + ')[0] || 'Cormorant Garamond'}', 'serif'],\n        body: ['${typographyList.split(' + ')[1] || 'Inter'}', 'sans-serif'],\n      }\n    }\n  }\n}`;
        }

        return '';
      }, [selectedItems, items, targetTool]);

      const handleCopyPrompt = () => {
        const textarea = document.createElement('textarea');
        textarea.value = generatedPrompt;
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand('copy');
        document.body.removeChild(textarea);
        setCopiedText(true);
        setTimeout(() => setCopiedText(false), 2000);

                </div>

                {/* Sandbox Live Showcase Area */}
                <div className="grid grid-cols-1 lg:grid-cols-2 gap-8">
                  
                  {/* Preview Card 1: Warm Editorial Card */}
                  <div className="bg-[#FAF8F5] text-[#1C1612] p-8 rounded-2xl border border-stone-300 shadow-lg space-y-6 font-serif">
                    <div className="text-xs font-mono uppercase tracking-widest text-terracotta-700 font-medium">
                      // Style Archetype: Warm Editorial Minimal
                    </div>
                    <h3 className="text-3xl font-normal leading-tight italic">
                      Crafting memorable web UI through intentional restraint.
                    </h3>
                    <p className="text-xs text-stone-600 font-sans leading-relaxed">
                      This component demonstrates high contrast serif headers with warm paper canvas, crisp hairline borders, terracotta highlights, and zero harsh floating shadows.
                    </p>
                    <div className="pt-4 border-t border-stone-200 flex items-center justify-between text-xs font-sans">
                      <span className="font-semibold uppercase tracking-wider text-[10px] text-terracotta-600">Read Editorial Guide →</span>
                      <span className="text-stone-400">Jul 2026</span>
                    </div>
                  </div>

                  {/* Preview Card 2: Nordic Sage Component */}
                  <div className="bg-[#F3EFEC] text-stone-900 p-8 rounded-2xl border border-stone-300 shadow-lg space-y-6 font-sans">
                    <div className="text-xs font-mono font-semibold uppercase tracking-wider text-sage-700 bg-sage-100 px-2.5 py-1 inline-block rounded-lg border border-sage-200">
                      Style Archetype: Nordic Studio
                    </div>
                    <h3 className="text-2xl font-bold tracking-tight text-stone-900">
                      Tactile & Humanistic Modern UI
                    </h3>
                    <p className="text-xs font-normal leading-relaxed text-stone-600">
                      Soft organic linen tints, natural sage green focal cards, high legibility body text, and spacious padding.
                    </p>
                    <button className="bg-sage-600 hover:bg-sage-700 text-white font-medium px-5 py-2.5 rounded-xl text-xs transition-all shadow-sm">
                      Interactive Element
                    </button>
                  </div>

                  {/* Preview Card 3: Swiss Grid Minimalist */}
                  <div className="bg-white text-stone-900 p-8 rounded-2xl border border-stone-300 shadow-md space-y-6 font-mono col-span-1 lg:col-span-2">
                    <div className="flex items-center justify-between">
                      <span className="text-xs text-stone-500">// Style Archetype: Swiss Precision Grid</span>
                      <span className="text-[10px] bg-stone-100 text-stone-700 border border-stone-300 px-2 py-0.5 rounded font-bold">GRID ACTIVE</span>
                    </div>
                    <h3 className="text-xl font-bold font-sans text-stone-900">
                      Swiss Precision & Monospace Visual Identity
                    </h3>
                    <p className="text-xs text-stone-600 font-sans leading-relaxed max-w-xl">
                      Pure white canvas, micro 1px stone grid lines, neutral color accents, high density informational layout with clear typography hierarchy.
                    </p>
                    <div className="flex items-center gap-3 font-mono text-xs">
                      <span className="bg-stone-100 text-stone-800 border border-stone-300 px-3 py-1.5 rounded-lg">npm install @taste/style</span>
                      <span className="bg-stone-200 text-stone-600 px-3 py-1.5 rounded-lg">v2.4.0</span>
                    </div>
                  </div>

                </div>

              </div>
            )}

          </main>

          {viewItem && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-stone-950/60 backdrop-blur-sm">
              <div className={`w-full max-w-2xl rounded-2xl border ${activeTheme.border} ${activeTheme.panelBg} overflow-hidden shadow-2xl max-h-[90vh] flex flex-col`}>
                
                <div className="relative aspect-video bg-stone-900 overflow-hidden">
                  <img src={viewItem.imageUrl} alt={viewItem.title} className="w-full h-full object-cover" />
                  <button
                    onClick={() => setViewItem(null)}
                    className="absolute top-3 right-3 bg-white/80 dark:bg-stone-950/80 text-stone-800 dark:text-stone-200 p-2 rounded-full backdrop-blur-md border border-stone-200 dark:border-stone-800"
                  >
                    ✕
                  </button>
                </div>

                <div className="p-6 space-y-4 overflow-y-auto flex-1">
                  <div className="flex items-start justify-between">
                    <div>
                      <span className={`text-[10px] font-mono ${activeTheme.badgeBg} px-2.5 py-1 rounded border`}>
                        {viewItem.category}
                      </span>
                      <h2 className={`text-lg font-bold font-serif ${activeTheme.textPrimary} mt-2`}>{viewItem.title}</h2>
                    </div>
                    {viewItem.sourceUrl && (
                      <a
                        href={viewItem.sourceUrl}
                        target="_blank"
                        rel="noopener noreferrer"
                        className="flex items-center space-x-1 text-xs text-terracotta-600 hover:underline"
                      >
                        <span>Visit Link</span>
                        <Icons.ExternalLink />
                      </a>
                    )}
                  </div>

                  {/* Colors */}
                  {viewItem.colors && (
                    <div className="space-y-1.5">
                      <label className={`text-[11px] font-mono ${activeTheme.textMuted}`}>Color Palette</label>
                      <div className="flex items-center space-x-2">
                        {viewItem.colors.map((hex, i) => (
                          <div key={i} className={`flex items-center space-x-1.5 ${activeTheme.cardBg} px-2 py-1 rounded-lg border ${activeTheme.border}`}>
                            <div className="w-4 h-4 rounded border border-black/10 dark:border-white/10" style={{ backgroundColor: hex }} />
                            <span className={`text-[10px] font-mono ${activeTheme.textPrimary}`}>{hex}</span>
                          </div>
                        ))}
                      </div>
                    </div>
                  )}

                  {/* Prompt Keywords */}
                  <div className="space-y-1">
                    <label className={`text-[11px] font-mono ${activeTheme.textMuted}`}>AI Prompt Tokens</label>
                    <p className={`p-3 rounded-xl border ${activeTheme.border} ${activeTheme.codeBg} text-xs font-mono`}>
                      {viewItem.promptKeywords}
                    </p>
                  </div>

                  {/* Personal Notes */}
                  {viewItem.notes && (
                    <div className="space-y-1">
                      <label className={`text-[11px] font-mono ${activeTheme.textMuted}`}>Personal Taste Notes</label>
                      <p className={`text-xs ${activeTheme.textSecondary} leading-relaxed p-3 rounded-xl border ${activeTheme.border} ${activeTheme.cardBg}`}>
                        {viewItem.notes}
                      </p>
                    </div>
                  )}
                </div>

                <div className={`p-4 border-t ${activeTheme.border} flex justify-end`}>
                  <button
                    onClick={() => setViewItem(null)}
                    className={`px-4 py-2 ${activeTheme.accentBg} text-xs font-semibold rounded-xl`}
                  >
                    Close
                  </button>
                </div>

              </div>
            </div>
          )}

          {isAddModalOpen && (
            <AddInspirationModal
              onClose={() => setIsAddModalOpen(false)}
              onAdd={handleAddItem}
              categories={categories.filter(c => c !== 'All')}
              activeTheme={activeTheme}
            />
          )}

        </div>
      );
    }

    function AddInspirationModal({ onClose, onAdd, categories, activeTheme }) {
      const [title, setTitle] = useState('');
      const [sourceUrl, setSourceUrl] = useState('');
      const [imageUrl, setImageUrl] = useState('');
      const [category, setCategory] = useState(categories[0] || 'Hero Section');
      const [tags, setTags] = useState('Warm Editorial, Minimal, Serif');
      const [colors, setColors] = useState('#FAF8F5, #1C1612, #C2593F');
      const [typography, setTypography] = useState('Cormorant Garamond + Inter');
      const [promptKeywords, setPromptKeywords] = useState('');
      const [notes, setNotes] = useState('');

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!title) return;

        const newItem = {
          id: Date.now().toString(),
          title,
          sourceUrl,
          imageUrl: imageUrl || 'https://images.unsplash.com/photo-1507238691740-187a5b1d37b8?auto=format&fit=crop&w=1000&q=80',
          category,
          aestheticTags: tags.split(',').map(t => t.trim()).filter(Boolean),
          colors: colors.split(',').map(c => c.trim()).filter(Boolean),
          typography,
          promptKeywords: promptKeywords || `${title}, editorial design, high contrast typography`,
          notes,
          dateAdded: new Date().toISOString().split('T')[0]
        };

        onAdd(newItem);
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-stone-950/60 backdrop-blur-sm">
          <div className={`w-full max-w-xl rounded-2xl border ${activeTheme.border} ${activeTheme.panelBg} overflow-hidden shadow-2xl max-h-[90vh] flex flex-col`}>
            
            <div className={`p-5 border-b ${activeTheme.border} flex items-center justify-between`}>
              <div>
                <h3 className={`text-base font-bold font-serif ${activeTheme.textPrimary}`}>Add Design Inspiration</h3>
                <p className={`text-xs ${activeTheme.textMuted}`}>Save web designs, Pinterest screenshots, or color schemes to your taste gallery</p>
              </div>
              <button onClick={onClose} className={`${activeTheme.textMuted} hover:${activeTheme.textPrimary} text-lg`}>✕</button>
            </div>

            <form onSubmit={handleSubmit} className="p-5 space-y-4 overflow-y-auto flex-1 text-xs">
              
              <div>
                <label className={`block ${activeTheme.textMuted} mb-1 font-mono`}>Title *</label>
                <input
                  type="text"
                  required
                  placeholder="e.g. Minimalist Swiss Architectural Landing Page"
                  value={title}
                  onChange={e => setTitle(e.target.value)}
                  className={`w-full border ${activeTheme.border} ${activeTheme.cardBg} rounded-xl p-2.5 ${activeTheme.textPrimary} focus:outline-none focus:border-terracotta-500`}
                />
              </div>

              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className={`block ${activeTheme.textMuted} mb-1 font-mono`}>Image URL</label>
                  <input
                    type="url"
                    placeholder="https://..."
                    value={imageUrl}
                    onChange={e => setImageUrl(e.target.value)}
                    className={`w-full border ${activeTheme.border} ${activeTheme.cardBg} rounded-xl p-2.5 ${activeTheme.textPrimary} focus:outline-none focus:border-terracotta-500`}
                  />
                </div>

                <div>
                  <label className={`block ${activeTheme.textMuted} mb-1 font-mono`}>Category</label>
                  <select
                    value={category}
                    onChange={e => setCategory(e.target.value)}
                    className={`w-full border ${activeTheme.border} ${activeTheme.cardBg} rounded-xl p-2.5 ${activeTheme.textPrimary} focus:outline-none focus:border-terracotta-500`}
                  >
                    {categories.map(c => (
                      <option key={c} value={c}>{c}</option>
                    ))}
                  </select>
                </div>
              </div>

              <div>
                <label className={`block ${activeTheme.textMuted} mb-1 font-mono`}>Source Link (Optional)</label>
                <input
                  type="url"
                  placeholder="https://pinterest.com/pin/... or website URL"
                  value={sourceUrl}
                  onChange={e => setSourceUrl(e.target.value)}
                  className={`w-full border ${activeTheme.border} ${activeTheme.cardBg} rounded-xl p-2.5 ${activeTheme.textPrimary} focus:outline-none focus:border-terracotta-500`}
                />
              </div>

              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className={`block ${activeTheme.textMuted} mb-1 font-mono`}>Aesthetic Tags (comma separated)</label>
                  <input
                    type="text"
                    placeholder="Warm Editorial, Glassmorphism, Brutalism"
                    value={tags}
                    onChange={e => setTags(e.target.value)}
                    className={`w-full border ${activeTheme.border} ${activeTheme.cardBg} rounded-xl p-2.5 ${activeTheme.textPrimary} focus:outline-none focus:border-terracotta-500`}
                  />
                </div>

                <div>
                  <label className={`block ${activeTheme.textMuted} mb-1 font-mono`}>Hex Colors (comma separated)</label>
                  <input
                    type="text"
                    placeholder="#FAF8F5, #1C1612, #C2593F"
                    value={colors}
                    onChange={e => setColors(e.target.value)}
                    className={`w-full border ${activeTheme.border} ${activeTheme.cardBg} rounded-xl p-2.5 ${activeTheme.textPrimary} focus:outline-none focus:border-terracotta-500`}
                  />
                </div>
              </div>

              <div>
                <label className={`block ${activeTheme.textMuted} mb-1 font-mono`}>AI Prompt Keywords & Descriptors</label>
                <textarea
                  rows="2"
                  placeholder="e.g., Warm cream canvas, 1px thin hairline borders, high kerning headers, no box shadows"
                  value={promptKeywords}
                  onChange={e => setPromptKeywords(e.target.value)}
                  className={`w-full border ${activeTheme.border} ${activeTheme.cardBg} rounded-xl p-2.5 ${activeTheme.textPrimary} focus:outline-none focus:border-terracotta-500`}
                />
              </div>

              <div>
                <label className={`block ${activeTheme.textMuted} mb-1 font-mono`}>Why do you like this? (Taste Notes)</label>
                <textarea
                  rows="2"
                  placeholder="e.g. Love the serif typography contrast and non-digital warm paper feel."
                  value={notes}
                  onChange={e => setNotes(e.target.value)}
                  className={`w-full border ${activeTheme.border} ${activeTheme.cardBg} rounded-xl p-2.5 ${activeTheme.textPrimary} focus:outline-none focus:border-terracotta-500`}
                />
              </div>

              <div className={`pt-3 border-t ${activeTheme.border} flex justify-end space-x-2`}>
                <button
                  type="button"
                  onClick={onClose}
                  className={`px-4 py-2 border ${activeTheme.border} ${activeTheme.cardBg} ${activeTheme.textSecondary} font-semibold rounded-xl`}
                >
                  Cancel
                </button>
                <button
                  type="submit"
                  className={`px-4 py-2 ${activeTheme.accentBg} font-bold rounded-xl shadow-md`}
                >
                  Save Inspiration
                </button>
              </div>

            </form>

          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
